[workspace]
resolver = "3"
members = [
    "crates/keel-core",
    "crates/keel-daemon",
    "crates/keel-mcp",
    "crates/keel-cli",
    "crates/keel-github",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["KB"]
# No licence chosen — personal, unpublished software (HANDOFF "Assumptions").
# Deliberately absent rather than "UNLICENSED", which is not valid SPDX and
# makes `cargo deny` fail to parse it. `publish = false` plus deny.toml's
# `private.ignore` is the supported way to say this.
publish = false

[workspace.dependencies]
# Storage
duckdb = { version = "1.10505", features = ["bundled", "chrono", "serde_json"] }

# Domain
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Content
similar = "2"
sha2 = "0.10"
fastembed = "5"

# Daemon
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal
keel-core = { path = "crates/keel-core", version = "0.1.0" }
keel-mcp = { path = "crates/keel-mcp", version = "0.1.0" }

# Test-only
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# The definition of done forbids these in library code. Making them lints rather
# than review discipline means CI catches them, not a human reading a diff.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
# DuckDB is vendored and compiled from source, and its full debug info runs to
# many gigabytes — enough to fill a disk, which is how this setting was
# discovered. Line tables keep backtraces useful (file and line for every
# frame) while dropping the type and variable descriptions that make up the
# bulk. Debugging Keel's own Rust is unaffected in practice; stepping through
# DuckDB's C++ internals is not something this project does.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are debugged even less often than DuckDB is.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
