[workspace]
resolver = "3"
# The Tauri app is excluded on purpose: it drags in a large native dependency
# tree, and building a webview on every `cargo test --workspace` would make the
# fast feedback loop slow for no benefit. It is also suspended as of
# 2026-08-10 — the web build is the surface under development, and the shell's
# build script refuses to run without KEEL_DESKTOP=1. See its build.rs.
exclude = ["apps/desktop/src-tauri"]
members = [
    "crates/keel-core",
    "crates/keel-daemon",
    "crates/keel-mcp",
    "crates/keel-cli",
    "crates/keel-github",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["KB"]
# No licence chosen — personal, unpublished software (HANDOFF "Assumptions").
# Deliberately absent rather than "UNLICENSED", which is not valid SPDX and
# makes `cargo deny` fail to parse it. `publish = false` plus deny.toml's
# `private.ignore` is the supported way to say this.
publish = false

[workspace.dependencies]
# Storage
# `bundled` is not enabled here — `keel-core` owns that choice as a feature, so
# it can be turned off in favour of a system libduckdb. See its Cargo.toml.
#
# On its way out. Phase 9 replaces both engines with the single SQLite file
# below; this entry survives only until `keel migrate` has been verified against
# the real store, and KEEL-130 is the task that deletes it.
duckdb = { version = "1.10505", features = ["chrono", "serde_json"] }

# The replacement. `bundled` compiles the SQLite amalgamation, which is what
# makes the release artifact one static file with no library to ship beside it —
# measured at 23s for a cold release build of every dependency, against DuckDB's
# 22m11s. `sqlite-vec` is the vector index and `serde_json` the array columns:
# DuckDB's `VARCHAR[]` has no SQLite equivalent, and JSON in a TEXT column is
# what `rows.rs` already sends over the wire in both directions anyway.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json", "functions", "blob"] }
sqlite-vec = "0.1.9"

# Domain
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Content
similar = "2"
sha2 = "0.10"
base64 = "0.22"
fastembed = "5"

# Daemon
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Blocking HTTP for the CLI, which is synchronous and needs to talk to the
# daemon. `reqwest` would drag a tokio runtime into a process that has no other
# use for one.
ureq = { version = "2", default-features = false, features = ["json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal
keel-core = { path = "crates/keel-core", version = "0.1.0", default-features = false }
keel-mcp = { path = "crates/keel-mcp", version = "0.1.0", default-features = false }

# Test-only
insta = { version = "1", features = ["json", "redactions", "filters"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
# `deny`, not `forbid`, since Phase 9. `sqlite-vec` is registered through
# SQLite's `sqlite3_auto_extension` hook, which takes a raw function pointer and
# is unsafe by construction — there is no safe wrapper in `rusqlite` and no way
# to load the extension without one. `forbid` exists precisely so that an
# `#[allow]` cannot override it, so keeping it would have meant no vector search
# rather than a tidy lint setting.
#
# The exception is one block, in `store::sqlite::vector`, and it is the only
# `unsafe` in the workspace. Anything else that wants one has to argue for
# itself here first.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# The definition of done forbids these in library code. Making them lints rather
# than review discipline means CI catches them, not a human reading a diff.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
# DuckDB is vendored and compiled from source, and its full debug info runs to
# many gigabytes — enough to fill a disk, which is how this setting was
# discovered. Line tables keep backtraces useful (file and line for every
# frame) while dropping the type and variable descriptions that make up the
# bulk. Debugging Keel's own Rust is unaffected in practice; stepping through
# DuckDB's C++ internals is not something this project does.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are debugged even less often than DuckDB is.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
