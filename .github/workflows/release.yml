name: Release

# This workflow is written by hand, not produced by `dist generate`, and
# `dist-workspace.toml` sets `allow-dirty = ["ci"]` so that a regeneration does
# not quietly replace it. The reason is the Node step below: the daemon embeds
# the built site from `apps/desktop`, and a generated workflow has no way to
# know that, so it would produce a daemon that starts, serves nothing, and looks
# healthy. See PHASE-10 §3 and §10.
#
# It follows the shape of the workflow `dist` generates — build the per-target
# artifacts on their native runners, then build the installer once from the
# collected results — and calls `dist` for both. It does not call `dist host`;
# the release is created with `gh`, which is one fewer moving part to be wrong
# about, at the cost of not merging the per-target manifests.

on:
  push:
    tags:
      # A pushed tag is the only way to start a release, so a release always
      # leaves a permanent mark in the repository (§13: "a release is one CI run
      # and produces every target").
      #
      # These are ref *glob* filters, not regexes: `v0.1.0` and `v0.1.0-rc.1`
      # match, `v0.1` and `v0.1.0-notes`... also matches the second pattern, so
      # the prerelease detection in the publish job is what keeps an rc out of
      # `latest` rather than this filter.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  # Create the release and upload the assets.
  contents: write
  # The two below are what `actions/attest-build-provenance` needs to mint a
  # signed statement about the artifacts. Without `id-token: write` it fails at
  # the end of a successful build, which is an expensive way to find out.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned to match `dist-workspace.toml`'s `cargo-dist-version`. If the two
  # disagree, `dist` warns and the artifact is not the one that was configured.
  DIST_VERSION: "0.32.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    # `fromJSON` because one leg needs a label *list* and the other a single
    # label, and `runs-on` will not take a bare string where an array is meant.
    # Carrying both as JSON in the matrix is the documented way to mix them.
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      # One platform failing should not hide the result on the other two. A
      # release is all-or-nothing, but the diagnosis is much cheaper when every
      # leg has reported.
      fail-fast: false
      matrix:
        include:
          # **macOS builds are linked by Apple's toolchain and never
          # cross-compiled from Linux.** On Apple Silicon an executable must
          # carry at least an ad-hoc signature or the kernel kills the process
          # at exec. Apple's linker adds one; a binary cross-compiled from Linux
          # does not carry one and dies on every M-series Mac. The failure looks
          # exactly like a corrupt download — no diagnostic, no signature
          # message, just a killed process — so it would be blamed on the
          # installer or the network long before anyone suspected the linker.
          #
          # Both macOS targets build on **one self-hosted Apple Silicon Mac**
          # (B-72). The requirement is Apple's linker, not GitHub's hardware,
          # and `--target=x86_64-apple-darwin` on an arm64 host still links with
          # `cc` and still gets the ad-hoc signature. §10 had already planned
          # this shape for when GitHub retires the Intel runners in August 2027;
          # the repository staying private brought it forward, because hosted
          # macOS minutes are billed at ten times the Linux rate there and the
          # alternative was publishing the repository to get them free.
          #
          # Labels are the three a macOS arm64 runner assigns itself on
          # registration, so there is nothing to remember to set. **A job with
          # no matching runner queues; it does not fail.** A sleeping Mac looks
          # like a run that never starts.
          - target: aarch64-apple-darwin
            runner: '["self-hosted", "macOS", "ARM64"]'
          # Intel macOS and Linux were here until 0.1.0 was cut and both failed
          # on `ort-sys`, the ONNX Runtime binding `fastembed` pulls in. `ort`
          # downloads a prebuilt static library rather than compiling one, so
          # ONNX decides which platforms can link: there is no Intel macOS
          # prebuilt at all, and the Linux one wants glibc 2.38 against a
          # runner deliberately pinned to 2.35 to keep the floor low.
          #
          # They come back when embeddings can be built out — which is a
          # decision about the workspace's features, not a build fix, and is
          # recorded as an open question rather than settled here.
          #
          # Note for whoever restores Linux: `ubuntu-22.04`, not
          # `ubuntu-latest`. The glibc a binary links against is a floor, not a
          # preference — built on a newer image it refuses to start on anything
          # older, with a message that reads like a corrupt download.
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner keeps its working directory between jobs, so
      # `target/distrib` still holds whatever the previous target produced.
      # `upload-artifact` globs that directory, so without this each macOS job
      # would upload the other one's archives too. Harmless when the contents
      # agree and quietly wrong when they do not — a re-run after a failed
      # build would ship a stale archive alongside a fresh one.
      #
      # `checkout` cleans tracked files; `target/` is ignored, so it does not.
      - name: Clear the previous run's artifacts
        shell: bash
        run: rm -rf target/distrib

      # `rust-toolchain.toml` pins the version, so rustup installs it on demand
      # and this only has to add the target. On the self-hosted runner that is
      # a no-op after the first release.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Hosted runners start empty and need the cache. The self-hosted one
      # keeps `target/` between runs, so restoring a cache over the top buys
      # nothing and spends GitHub's cache storage on gigabytes it already has
      # on disk.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.target }}

      # --- The site the daemon embeds ---------------------------------------
      #
      # `keel-daemon` serves the React app from `apps/desktop` compiled into the
      # binary, so `apps/desktop/dist` must exist before cargo runs. `dist` has
      # no idea this dependency exists and will not do it; a build without these
      # three steps still succeeds and still produces a working MCP server,
      # which is why it needs saying here rather than being left to fail loudly.
      #
      # `npm run build` is `tsc --noEmit && vite build` — a type error fails the
      # release, which is the right moment for it to.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the site's dependencies
        # `ci`, not `install`: it installs exactly the lockfile and fails if
        # `package.json` and `package-lock.json` disagree, rather than resolving
        # something that was never tested.
        run: npm ci --prefix apps/desktop

      - name: Build the site
        run: npm run build --prefix apps/desktop

      # --- The binaries ------------------------------------------------------

      # Two ways in, chosen by what kind of machine this is.
      #
      # A hosted runner is a throwaway VM, so piping the upstream installer into
      # `sh` costs nothing that matters and takes seconds. A self-hosted runner
      # is somebody's actual Mac, and running an unreviewed downloaded script on
      # it every release is a different proposition — the more so because that
      # script is the one whose checksum verification this repository patches
      # (see `scripts/patch-installer.sh`). There, `cargo install --locked` goes
      # through crates.io with a lockfile instead, and re-running it when the
      # version already matches is a no-op rather than a rebuild.
      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(dist --version 2>/dev/null | awk '{print $2}')" = "$DIST_VERSION" ]; then
            echo "dist $DIST_VERSION already present"
          elif [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            cargo install cargo-dist --version "$DIST_VERSION" --locked
          else
            # `--proto '=https' --tlsv1.2` stop a redirect downgrading the
            # transfer to plaintext; `-f` makes curl fail on an HTTP error
            # instead of piping an error page into sh.
            #
            # The asset is still named `cargo-dist-installer.sh` at 0.32.0
            # despite the tool having renamed itself to `dist` — checked against
            # the release, not assumed. A 404 here means that changed.
            curl --proto '=https' --tlsv1.2 -LsSf \
              "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the artifacts for this target
        shell: bash
        run: |
          set -euo pipefail
          # `--artifacts=local` is this target's binaries, archives and
          # checksums. The installer is a global artifact and is built once, in
          # the publish job, from all three targets' results.
          dist build \
            --tag="${GITHUB_REF_NAME}" \
            --target="${{ matrix.target }}" \
            --artifacts=local

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*
          # An empty upload here would produce a release with a working-looking
          # installer pointing at archives that do not exist. Fail instead.
          if-no-files-found: error

  publish:
    name: installer, attestations and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `dist` reads the workspace to build the installer, so the source has to
      # be here even though nothing is compiled in this job. No Node either: the
      # embedded site is already inside the binaries downloaded below.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: target/distrib

      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the installer
        shell: bash
        run: |
          set -euo pipefail
          # Global artifacts are the shell installer and anything else that
          # spans targets. It embeds the checksums of the local artifacts, which
          # is why this runs after the download and not in parallel with it.
          dist build --tag="${GITHUB_REF_NAME}" --artifacts=global

      # Before the attestation, deliberately: the statement has to be about the
      # bytes people download, and those are the patched ones. Attesting first
      # would produce a signed claim about a file that no longer exists.
      #
      # The script exits non-zero if the block it rewrites is not there, which
      # fails the release. That is the intended behaviour — see its header. An
      # installer whose checksum path has not been checked is exactly the thing
      # this step exists to stop shipping.
      - name: Make the installer verify what it downloads
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/patch-installer.sh target/distrib/*.sh

      # Skipped while the repository is private, because GitHub will not do it:
      #
      #   Failed to persist attestation: Feature not available for user-owned
      #   private repositories. To enable this feature, please make this
      #   repository public.
      #
      # That is a straight consequence of B-72, which chose private, and it was
      # not anticipated there — attestations and privacy are simply not both
      # available on a user-owned repository. When the repository goes public
      # this starts working again with no change here.
      #
      # Conditional rather than deleted, and conditional rather than
      # `continue-on-error`. Deleting it would lose provenance silently the day
      # the repository goes public; `continue-on-error` would print a red X on
      # every release for a thing that cannot work, which is how people learn to
      # ignore red. The release notes say provenance is absent, so the gap is
      # stated where somebody downloading the artifact would see it rather than
      # only in a workflow log.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          # The archives and the installer — the two things a user actually
          # downloads, and so the two things `gh attestation verify` should be
          # able to speak about. `*.tar.*` rather than a fixed `.tar.xz` so that
          # setting `unix-archive` in `dist-workspace.toml` later does not
          # silently stop attesting anything.
          subject-path: |
            target/distrib/*.tar.*
            target/distrib/*.sh

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          args=(--title "$tag" --generate-notes --verify-tag)

          # A prerelease must not become `latest`. The standalone install line
          # in §1 fetches `.../releases/latest/download/keel-installer.sh`, so
          # an rc landing there would become the default download for everyone
          # who is not reading release notes.
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac

          # Files only, one level deep: `dist` leaves working directories under
          # `target/distrib` and `gh` errors on a directory argument.
          mapfile -t files < <(find target/distrib -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts in target/distrib — refusing to create an empty release" >&2
            exit 1
          fi

          # Say what this release does *not* carry, on the release itself.
          #
          # A missing guarantee that is only missing in a workflow log is a
          # guarantee people assume they have. Whoever downloads this should be
          # able to see that `gh attestation verify` will not recognise these
          # files, and why, without going looking for it.
          #
          # `--notes` prepends to `--generate-notes` rather than replacing it,
          # so the generated changelog still appears underneath. Built with
          # printf rather than a heredoc: a heredoc terminator inside a YAML
          # block scalar has to sit at column zero, which is a rule that quietly
          # stops holding the first time somebody re-indents this step.
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            args+=(--notes "$(printf '%s\n' \
              '> **No build provenance on this release.** GitHub does not offer artifact' \
              '> attestations for user-owned private repositories, so `gh attestation verify`' \
              '> will not recognise these files. The checksums embedded in the installer are' \
              '> still verified on download. Attestations resume on their own if this' \
              '> repository is ever made public.')")
          fi

          gh release create "$tag" "${args[@]}" "${files[@]}"
