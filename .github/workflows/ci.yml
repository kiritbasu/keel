name: CI

on:
  push:
    # Both names. This repository's trunk is `master` and the trigger said
    # `main`, so a push to trunk would not have started anything even once
    # there is a remote to push to. Listing both costs nothing and removes a
    # way for CI to be silently absent.
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Sunday morning, for the discovery jobs at the bottom of this file. They are
  # too slow to sit in front of a merge and their output is something to read
  # rather than something to satisfy.
  schedule:
    - cron: "0 6 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both finish. A failure on one platform should not hide the result on
      # the other, which is the whole reason for testing two.
      fail-fast: false
      matrix:
        # Linux is not decoration. This is a local-first SQLite tool, and the
        # two things most likely to differ between platforms are the two it
        # depends on most: file locking, and path handling. The path-traversal
        # finding that produced `safe_path` was in exactly that area, and it
        # was only ever exercised on macOS.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Dependencies dominate a cold build; the workspace's own crates are
      # quick. Caching the registry and target directory keeps a run to the
      # part that actually changed.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Not --all-features: no workspace crate declares a feature, so the flag
        # buys nothing and only costs a second full build (DECISIONS B-11).
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  snapshots:
    name: snapshots · no drift, no strays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      # The snapshots are the MCP API contract, and `cargo test` already fails
      # when one differs. What it does not catch is a snapshot file nothing
      # asserts on any more — left behind by a renamed or deleted test, still
      # committed, and read by the next person as though it described something
      # real. `--unreferenced=reject` is the difference between a contract and
      # a folder of old contracts.
      - name: Snapshot drift and unreferenced files
        run: cargo insta test --workspace --unreferenced=reject

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # --- Discovery, not gates -------------------------------------------------
  #
  # Everything below is scheduled and non-blocking, deliberately. At one
  # developer a coverage threshold that fails a PR is a number people learn to
  # satisfy rather than a question they answer, and mutation testing is far too
  # slow to sit in front of a merge. These run weekly and publish artifacts to
  # read, which is the useful shape: they are for finding holes, not for
  # refusing work.

  coverage:
    name: coverage (reported, not enforced)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Summarise
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt

  # The mutation-testing job was here, and it has been taken out rather than
  # disabled. It ran weekly against graph.rs, next.rs, safe_path.rs and id.rs,
  # ended in `|| true` so it could never fail a build, and took two hours and
  # thirteen minutes for those four files.
  #
  # It was removed because it had done its job and nobody had read the answer.
  # The one run that finished found twelve mutations the suite did not catch —
  # two of them in the ready/blocked ranking, where a wrong result is
  # indistinguishable from a real one — and those sat unread in an artifact for
  # two days. A weekly report nobody opens is not a safety net; it is a bill.
  #
  # The twelve are KEEL-214, which is where the value went. Bring the job back
  # when that is closed and there is traction worth protecting, and prefer
  # running it by hand against the files a change actually touched:
  #
  #   cargo mutants --no-shuffle -j 2 --file <the file you changed>
  #
  # Commented history is not kept here on purpose. `git log` has the job, and a
  # block of dead YAML is the kind of thing that gets uncommented years later
  # by someone who does not know why it was switched off.

  fuzz:
    name: fuzz smoke (60s per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Overrides `rust-toolchain.toml`, which pins the rest of the workspace to a
    # release. Without this the pin would win here too and cargo-fuzz would be
    # handed a stable compiler, where `-Z sanitizer=address` does not exist —
    # so the job would fail for a reason that has nothing to do with fuzzing.
    #
    # `RUSTUP_TOOLCHAIN` rather than `cargo +nightly` on each line: it covers
    # `cargo fuzz`'s own inner invocations too, which is where the pin would
    # otherwise reassert itself.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs nightly: libFuzzer arrives through
      # `-Z sanitizer=address`, which is not on stable.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Sixty seconds each. Not enough to prove anything, and that is fine —
      # these three parse untrusted strings, and the question a smoke run
      # answers is "does any input panic", which a minute of random bytes is
      # surprisingly good at. A long campaign would belong in its own workflow
      # with a corpus that persists between runs.
      - name: Smoke each target
        run: |
          for target in confine_path fts_query parse_id; do
            cargo fuzz run "$target" -- -max_total_time=60
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
