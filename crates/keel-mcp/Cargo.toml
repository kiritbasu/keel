[package]
name = "keel-mcp"
description = "MCP protocol layer for Keel — tool schemas, request decoding, response shaping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Propagated from keel-core so `--no-default-features` at the workspace level
# switches the whole build to a system libduckdb in one go.
default = ["bundled"]
bundled = ["keel-core/bundled"]

[lints]
workspace = true

[dependencies]
base64.workspace = true
keel-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
keel-core.workspace = true
