[package]
name = "keel-daemon"
description = "The Keel daemon: axum server exposing MCP and a local REST/SSE API. Owns the sole write handle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "keel_daemon"
path = "src/lib.rs"

[[bin]]
name = "keel-daemon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
keel-core.workspace = true
# The only crate that constructs the real embedder, because it is the only one
# that decides whether embeddings are on. keel-core deliberately cannot.
keel-embed.workspace = true
keel-mcp.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
async-stream.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["env"] }
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The end-to-end tier drives the real binary over a socket, and a blocking
# client keeps those tests readable — they are about the process, not about
# async.
ureq.workspace = true
insta.workspace = true
reqwest.workspace = true
