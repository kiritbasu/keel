[package]
name = "keel-cli"
description = "Thin Keel client: backup, restore, fsck, fixtures, generation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
keel-core.workspace = true
# For the protocol's own header names and version string, so `keel claim` and
# `keel close` talk to the daemon's MCP endpoint without a second copy of the
# handshake to keep in step. It brings no network dependency with it.
keel-mcp.workspace = true
# Only `keel reembed` constructs an embedder. It is the one CLI command whose
# job is the model, so it is the one place the ONNX dependency is worth having.
keel-embed.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
tracing.workspace = true
ureq.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
