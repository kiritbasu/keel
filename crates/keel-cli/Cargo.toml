[package]
name = "keel-cli"
description = "Thin Keel client: backup, restore, fsck, fixtures, migration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[features]
# Propagated from keel-core so `--no-default-features` at the workspace level
# switches the whole build to a system libduckdb in one go.
default = ["bundled"]
bundled = ["keel-core/bundled"]

[lints]
workspace = true

[dependencies]
keel-core.workspace = true
# For the protocol's own header names and version string, so `keel claim` and
# `keel close` talk to the daemon's MCP endpoint without a second copy of the
# handshake to keep in step. It brings no network dependency with it.
keel-mcp.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
tracing.workspace = true
ureq.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
