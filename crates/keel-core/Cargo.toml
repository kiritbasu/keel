[package]
name = "keel-core"
description = "Domain types, validation, storage and provenance for Keel. Never opens a socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Compile DuckDB from source. On by default because it makes the build work on
# any machine with no setup, and produces a binary that cannot disagree with the
# extensions it loads. The cost is several minutes on a cold build.
#
# Turn it off to link a system libduckdb instead — much faster, but the library
# has to be present at runtime and its version has to match the bindings
# `duckdb-rs` ships. See README, "Faster builds".
default = ["bundled"]
bundled = ["duckdb/bundled"]

[lints]
workspace = true

[dependencies]
duckdb.workspace = true
ulid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
similar.workspace = true
sha2.workspace = true
fastembed.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
