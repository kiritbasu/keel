[package]
# Its own crate because both shipped binaries need it and neither can reach the
# other's copy. `keel update` is a command in the `keel` binary; the unattended
# check runs in the daemon. `keel` already depends on `keel-daemon`, so putting
# this there would be a cycle, and `keel` has no lib target for the daemon to
# depend on instead.
#
# It could not go in `keel-core` either, and that is the more important half:
# `keel-core` never opens a network socket, and this does nothing else. Keeping
# that boundary is what makes every other surface cheap to add.
name = "keel-update"
description = "Keel: checking for, verifying and installing a newer release."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# For `shipped_schema_version`, which is the number the whole decision turns on.
keel-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
sha2.workspace = true
tempfile.workspace = true
tracing.workspace = true

[dev-dependencies]
