[package]
# `keel`, not `keel-cli`, and this package now owns both shipped binaries.
#
# `dist` names an installer after the package that owns the binaries, and it
# treats every package with binaries as its own app. As two packages that meant
# two installers — `keel-cli-installer.sh` and `keel-daemon-installer.sh` —
# while PHASE-10 §1 advertises one `keel-installer.sh`, and
# `scripts/verify-release-tier1.sh` asserts that running *one* installer leaves
# both `keel` and `keel-daemon` on disk. Two installers would have satisfied
# neither, and there is no `dist` setting that folds one package's binaries into
# another's archive — `binaries` is a per-platform override, not a manifest.
#
# So the daemon's `main.rs` lives here as `src/bin/keel-daemon.rs` and
# `keel-daemon` is a library this package depends on. That crate is still where
# the daemon *is*; what moved is 350 lines of argument parsing and process
# lifecycle, and the two integration tests that drive the real process through
# `CARGO_BIN_EXE_keel-daemon` — which resolves in the package that declares the
# binary, and nowhere else. See B-70 and KEEL-208.
name = "keel"
description = "Keel: the store's command line and the daemon that serves it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[[bin]]
name = "keel-daemon"
path = "src/bin/keel-daemon.rs"

[package.metadata.dist]
# `publish = false` is set workspace-wide (see the root `Cargo.toml` for why),
# and `dist` reads that as "this package is not for distribution" — it refused
# the whole workspace with "no packages with distable binaries" until this said
# otherwise. The opt-in is per-package and there is no workspace-level form.
dist = true

[lints]
workspace = true

# Forwards to the daemon's, and both have to move together: this crate builds
# the `keel-daemon` binary as well as `keel`, so a `keel` without embeddings
# that still pulled a daemon with them would link the ONNX runtime anyway and
# the feature would buy nothing. See `keel-daemon/Cargo.toml` for the argument.
[features]
default = ["embeddings"]
embeddings = ["dep:keel-embed", "keel-daemon/embeddings"]

[dependencies]
keel-core.workspace = true
# For the protocol's own header names and version string, so `keel claim` and
# `keel close` talk to the daemon's MCP endpoint without a second copy of the
# handshake to keep in step. It brings no network dependency with it.
keel-mcp.workspace = true
# Only `keel reembed` constructs an embedder. It is the one CLI command whose
# job is the model, so it is the one place the ONNX dependency is worth having.
keel-embed = { workspace = true, optional = true }
# The daemon's library half, for the `keel-daemon` binary above. Nothing in the
# `keel` binary references it, so the linker drops it there; what it costs is
# that a `cargo build -p keel` now builds axum and tokio, which a workspace
# build was doing anyway.
keel-daemon.workspace = true
# `keel update` is a thin call into this. It lives in its own crate because the
# daemon needs the same code and cannot depend on a binary package.
keel-update.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
tracing.workspace = true
ureq.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The contracts test reads the store's shape through PRAGMA and hashes the
# generated tree. Both are test-only: the CLI itself never opens SQLite
# directly, and keeping it that way is the point of the storage traits.
rusqlite.workspace = true
sha2.workspace = true
